<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="flowarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <filter id="flowShadow" x="-2%" y="-2%" width="104%" height="108%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="1000" height="1240" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1239" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- header -->
  <text x="500" y="62" text-anchor="middle" font-size="38" font-weight="700" fill="#ffffff">How an Investigation Flows, End to End</text>
  <text x="500" y="104" text-anchor="middle" font-size="20" fill="#f5f5f5">From a scanner finding an open directory to a detection rule running in someone else's SOC</text>
  <line x1="60" y1="136" x2="940" y2="136" stroke="#2a2a2a" stroke-width="1"/>

  <!-- ============ STEP BANDS (left gutter) ============ -->
  <line x1="178" y1="180" x2="178" y2="564" stroke="#b8902f" stroke-width="2" opacity="0.55"/>
  <text x="44" y="360" font-size="15" font-weight="700" fill="#b8902f" letter-spacing="1.2">STEP 1</text>
  <text x="44" y="382" font-size="16" fill="#e5e5e5">Find &amp; Choose</text>

  <line x1="178" y1="594" x2="178" y2="840" stroke="#b8902f" stroke-width="2" opacity="0.55"/>
  <text x="44" y="705" font-size="15" font-weight="700" fill="#b8902f" letter-spacing="1.2">STEP 2</text>
  <text x="44" y="727" font-size="16" fill="#e5e5e5">Analyze &amp; Draft</text>

  <line x1="178" y1="870" x2="178" y2="1116" stroke="#b8902f" stroke-width="2" opacity="0.55"/>
  <text x="44" y="981" font-size="15" font-weight="700" fill="#b8902f" letter-spacing="1.2">STEP 3</text>
  <text x="44" y="1003" font-size="16" fill="#e5e5e5">Verify &amp; Ship</text>

  <!-- ============ 1. SCAN ============ -->
  <g filter="url(#flowShadow)">
    <rect x="210" y="180" width="750" height="108" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="210" y="180" width="6" height="108" rx="3" fill="#58a6ff"/>
  </g>
  <circle cx="252" cy="234" r="18" fill="#58a6ff"/>
  <text x="252" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#0d1117">1</text>
  <text x="286" y="216" font-size="21" font-weight="700" fill="#ffffff">Scan</text>
  <text x="286" y="244" font-size="15" fill="#cccccc">Every night, the announced IP space of 65 bulletproof-hosting networks across</text>
  <text x="286" y="266" font-size="15" fill="#cccccc">28 ports. Confirmed open directories get crawled and every file checked.</text>
  <line x1="585" y1="292" x2="585" y2="312" stroke="#666666" stroke-width="2" marker-end="url(#flowarrow)"/>

  <!-- ============ 2. TRIAGE ============ -->
  <g filter="url(#flowShadow)">
    <rect x="210" y="318" width="750" height="108" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="210" y="318" width="6" height="108" rx="3" fill="#58a6ff"/>
  </g>
  <circle cx="252" cy="372" r="18" fill="#58a6ff"/>
  <text x="252" y="379" text-anchor="middle" font-size="18" font-weight="700" fill="#0d1117">2</text>
  <text x="286" y="354" font-size="21" font-weight="700" fill="#ffffff">Triage</text>
  <text x="286" y="382" font-size="15" fill="#cccccc">Findings rank by threat signal in a dashboard. Files no antivirus engine knows</text>
  <text x="286" y="404" font-size="15" fill="#cccccc">about yet rise to the top, alongside anything exposing credentials.</text>
  <line x1="585" y1="430" x2="585" y2="450" stroke="#666666" stroke-width="2" marker-end="url(#flowarrow)"/>

  <!-- ============ 3. CHOOSE ============ -->
  <g filter="url(#flowShadow)">
    <rect x="210" y="456" width="750" height="108" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="210" y="456" width="6" height="108" rx="3" fill="#b8902f"/>
  </g>
  <circle cx="252" cy="510" r="18" fill="#b8902f"/>
  <text x="252" y="517" text-anchor="middle" font-size="18" font-weight="700" fill="#161616">3</text>
  <text x="286" y="492" font-size="21" font-weight="700" fill="#ffffff">Choose</text>
  <text x="286" y="520" font-size="15" fill="#cccccc">A recon pass built to say no. One question settles it, which is what intelligence</text>
  <text x="286" y="542" font-size="15" fill="#cccccc">this would produce and who could act on it. Most candidates are rejected.</text>
  <line x1="585" y1="568" x2="585" y2="588" stroke="#666666" stroke-width="2" marker-end="url(#flowarrow)"/>

  <!-- ============ 4. ANALYZE ============ -->
  <g filter="url(#flowShadow)">
    <rect x="210" y="594" width="750" height="108" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="210" y="594" width="6" height="108" rx="3" fill="#b8902f"/>
  </g>
  <circle cx="252" cy="648" r="18" fill="#b8902f"/>
  <text x="252" y="655" text-anchor="middle" font-size="18" font-weight="700" fill="#161616">4</text>
  <text x="286" y="630" font-size="21" font-weight="700" fill="#ffffff">Analyze</text>
  <text x="286" y="658" font-size="15" fill="#cccccc">Detonation in an isolated lab, static examination, reverse engineering. This is</text>
  <text x="286" y="680" font-size="15" fill="#cccccc">the part that does not get automated, and it is where the findings come from.</text>
  <line x1="585" y1="706" x2="585" y2="726" stroke="#666666" stroke-width="2" marker-end="url(#flowarrow)"/>

  <!-- ============ 5. DRAFT ============ -->
  <g filter="url(#flowShadow)">
    <rect x="210" y="732" width="750" height="108" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="210" y="732" width="6" height="108" rx="3" fill="#58a6ff"/>
  </g>
  <circle cx="252" cy="786" r="18" fill="#58a6ff"/>
  <text x="252" y="793" text-anchor="middle" font-size="18" font-weight="700" fill="#0d1117">5</text>
  <text x="286" y="768" font-size="21" font-weight="700" fill="#ffffff">Draft</text>
  <text x="286" y="796" font-size="15" fill="#cccccc">Eight specialist agents turn the raw analysis into a report, an IOC feed, and</text>
  <text x="286" y="818" font-size="15" fill="#cccccc">detection rules, working to written standards. I sign off at two checkpoints.</text>
  <line x1="585" y1="844" x2="585" y2="864" stroke="#666666" stroke-width="2" marker-end="url(#flowarrow)"/>

  <!-- ============ 6. VERIFY ============ -->
  <g filter="url(#flowShadow)">
    <rect x="210" y="870" width="750" height="108" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="210" y="870" width="6" height="108" rx="3" fill="#4ade80"/>
  </g>
  <circle cx="252" cy="924" r="18" fill="#4ade80"/>
  <text x="252" y="931" text-anchor="middle" font-size="18" font-weight="700" fill="#0d1117">6</text>
  <text x="286" y="906" font-size="21" font-weight="700" fill="#ffffff">Verify</text>
  <text x="286" y="934" font-size="15" fill="#cccccc">Every rule compiled by the real engine before it can ship. Checks report PASS,</text>
  <text x="286" y="956" font-size="15" fill="#cccccc">FAIL, or NOT CHECKED, and the third is never quietly folded into the first.</text>
  <line x1="585" y1="982" x2="585" y2="1002" stroke="#666666" stroke-width="2" marker-end="url(#flowarrow)"/>

  <!-- ============ 7. SHIP ============ -->
  <g filter="url(#flowShadow)">
    <rect x="210" y="1008" width="750" height="108" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="210" y="1008" width="6" height="108" rx="3" fill="#4ade80"/>
  </g>
  <circle cx="252" cy="1062" r="18" fill="#4ade80"/>
  <text x="252" y="1069" text-anchor="middle" font-size="18" font-weight="700" fill="#0d1117">7</text>
  <text x="286" y="1044" font-size="21" font-weight="700" fill="#ffffff">Ship</text>
  <text x="286" y="1072" font-size="15" fill="#cccccc">The site, the public feeds, STIX bundles for OpenCTI and MISP, upstream rule</text>
  <text x="286" y="1094" font-size="15" fill="#cccccc">repositories, my own detection stack, and the CERTs who need it before anyone.</text>

  <!-- ============ LEGEND ============ -->
  <line x1="60" y1="1152" x2="940" y2="1152" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="210" y="1180" width="14" height="14" rx="3" fill="#58a6ff"/>
  <text x="234" y="1192" font-size="15" fill="#cccccc">Automated</text>
  <rect x="360" y="1180" width="14" height="14" rx="3" fill="#b8902f"/>
  <text x="384" y="1192" font-size="15" fill="#cccccc">My judgment</text>
  <rect x="520" y="1180" width="14" height="14" rx="3" fill="#4ade80"/>
  <text x="544" y="1192" font-size="15" fill="#cccccc">Verified and out the door</text>
</svg>
