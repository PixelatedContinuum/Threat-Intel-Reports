<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1982" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1000" height="1982" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1981" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">The Signed OneDrive Side-Load</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">A Microsoft binary loads a Rockstar-signed DLL that reads OneDrive</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">Capability read in code; no execution on a victim host is shown</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="196" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="196" width="880" height="46" rx="8" fill="#f97316"/>
    <rect x="60" y="229" width="880" height="13" fill="#f97316"/>
    <text x="80" y="227" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 1</text>
    <text x="200" y="227" font-size="23" font-weight="600" fill="#111111">A genuine Microsoft binary starts</text>
    <text x="80" y="282" font-size="21" fill="#ffffff">edge.exe is Microsoft's signed cookie_exporter.exe (Edge 134), renamed</text>
    <text x="80" y="316" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">LoadLibraryExA("msedge.dll") with the application-directory flag</text>
    <text x="80" y="350" font-size="18" fill="#e5e5e5">It loads whatever msedge.dll sits beside it, then calls ExportSpartanCookies</text>
    <text x="80" y="384" font-size="18" fill="#fb923c" font-weight="600">Hunt: the Edge helper running outside the Edge install directory</text>
  </g>
  <line x1="500" y1="416" x2="500" y2="456" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="462" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="462" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="495" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="493" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 2</text>
    <text x="200" y="493" font-size="23" font-weight="600" fill="#ffffff">The Rockstar-signed DLL answers</text>
    <text x="80" y="548" font-size="21" fill="#ffffff">msedge.dll: 312,488 bytes, 288 exports copied from Microsoft's own DLL</text>
    <text x="80" y="582" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">Only ExportSpartanCookies carries logic; the other 287 are stubs (MODERATE)</text>
    <text x="80" y="616" font-size="18" fill="#e5e5e5">Both signatures verify under an expired 2017 Rockstar Games key; Windows rejects them</text>
    <text x="80" y="650" font-size="18" fill="#fb923c" font-weight="600">Hunt: msedge.dll loaded without a Microsoft signature</text>
  </g>
  <line x1="500" y1="682" x2="500" y2="722" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="728" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="728" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="761" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="759" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 3</text>
    <text x="200" y="759" font-size="23" font-weight="600" fill="#ffffff">Shellcode runs on the calling thread</text>
    <text x="80" y="814" font-size="21" fill="#ffffff">API names built by adding 1 to each byte; 49,696 bytes copied from .data</text>
    <text x="80" y="848" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">VirtualAlloc, VirtualProtect, then EnumWindows with the shellcode as callback</text>
    <text x="80" y="882" font-size="18" fill="#e5e5e5">No remote injection, and the library the shellcode uses is not imported</text>
    <text x="80" y="916" font-size="18" fill="#fb923c" font-weight="600">Hunt: the YARA rule on the shellcode immediates</text>
  </g>
  <line x1="500" y1="948" x2="500" y2="988" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="994" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="994" width="880" height="46" rx="8" fill="#eab308"/>
    <rect x="60" y="1027" width="880" height="13" fill="#eab308"/>
    <text x="80" y="1025" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 4</text>
    <text x="200" y="1025" font-size="23" font-weight="600" fill="#111111">The implant decrypts its configuration</text>
    <text x="80" y="1080" font-size="21" fill="#ffffff">Walks the environment block, takes mutex Global\OdMutex, reads config.bin</text>
    <text x="80" y="1114" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">AES-256-CBC: 32-byte key, 16-byte IV, 1,440-byte ciphertext (1,488 bytes in all)</text>
    <text x="80" y="1148" font-size="18" fill="#e5e5e5">The plaintext is a tenant identifier and a refresh token, both withheld here</text>
    <text x="80" y="1182" font-size="18" fill="#fb923c" font-weight="600">Anchor: the mutex Global\OdMutex, listed in the indicator feed</text>
  </g>
  <line x1="500" y1="1214" x2="500" y2="1254" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="1260" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="1260" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1293" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1291" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 5</text>
    <text x="200" y="1291" font-size="23" font-weight="600" fill="#ffffff">The implant signs in to Microsoft</text>
    <text x="80" y="1346" font-size="21" fill="#ffffff">A refresh-token grant to login.microsoftonline.com, then Microsoft Graph</text>
    <text x="80" y="1380" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">WinINet agent string exactly "Mozilla"; the token is refreshed every 15 minutes</text>
    <text x="80" y="1414" font-size="18" fill="#e5e5e5">No operator address or domain exists in the DLL, the shellcode or the configuration</text>
    <text x="80" y="1448" font-size="18" fill="#fb923c" font-weight="600">Hunt: browserless refresh-token sign-ins with the agent string Mozilla</text>
  </g>
  <line x1="500" y1="1480" x2="500" y2="1520" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="1526" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="1526" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1559" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1557" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 6</text>
    <text x="200" y="1557" font-size="23" font-weight="600" fill="#ffffff">OneDrive is the command server</text>
    <text x="80" y="1612" font-size="21" fill="#ffffff">It polls cmd/command.txt every 20 seconds and writes cmd/output.txt</text>
    <text x="80" y="1646" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">Verbs: cmd sleep whereami active deactive schtasks fsys download exit uninstall</text>
    <text x="80" y="1680" font-size="18" fill="#e5e5e5">The beacon stops unless it receives active within about 10 polls (MODERATE)</text>
    <text x="80" y="1714" font-size="18" fill="#fb923c" font-weight="600">Hunt: cbt.bin created beside the side-loaded Edge helper</text>
  </g>
  <line x1="60" y1="1792" x2="940" y2="1792" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1826" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Detection anchors:  msedge.dll without a Microsoft signature</text>
  <text x="500" y="1856" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Edge helper outside its install directory  ·  mutex Global\OdMutex</text>
  <text x="500" y="1886" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Graph requests under a cmd folder with the agent string Mozilla</text>
  <text x="500" y="1922" text-anchor="middle" font-size="15" fill="#cccccc">Whether either implant ever ran on a victim host, and whether the token still works, are NOT CHECKED</text>
  <text x="500" y="1954" text-anchor="middle" font-size="14" fill="#888888">Legend: orange = trigger · red = operator code · yellow = staging · deep red = command channel</text>
</svg>
