<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1000" height="1370" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1369" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">Command and Relay Channel Map</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">How the operator, the platform and the pod connect</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">Solid links have a captured 200; dashed links are inferred or not shown in any held file</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>

  <rect x="40" y="196" width="380" height="804" rx="10" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="60" y="232" font-size="20" font-weight="700" fill="#ffffff">OPERATOR'S RENTED SERVER</text>
  <text x="60" y="256" font-size="15" fill="#cccccc">One host, roles split by port</text>
  <rect x="580" y="555" width="380" height="445" rx="10" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="600" y="590" font-size="16" font-weight="700" fill="#ffffff">POD: EXECUTION INFERRED, NOT SHOWN</text>
  <g filter="url(#cardShadow)">
    <rect x="60" y="275" width="340" height="200" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="275" width="340" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="308" width="340" height="13" fill="#dc2626"/>
    <text x="76" y="305" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STAGE 4 · SCRIPTED ENDPOINT</text>
    <text x="76" y="357" font-size="18" fill="#ffffff">Fake model server: returns the</text>
    <text x="76" y="384" font-size="18" fill="#ffffff">next queued tool call each turn</text>
    <text x="76" y="411" font-size="18" fill="#ffffff">and logs the results posted back</text>
    <text x="76" y="446" font-size="17" font-weight="600" fill="#fb923c">Code read: HIGH</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="60" y="515" width="340" height="200" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="515" width="340" height="46" rx="8" fill="#eab308"/>
    <rect x="60" y="548" width="340" height="13" fill="#eab308"/>
    <text x="76" y="545" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STAGES 5-6 · PAYLOAD SERVER</text>
    <text x="76" y="597" font-size="18" fill="#ffffff">Port roles: payload download and</text>
    <text x="76" y="624" font-size="18" fill="#ffffff">pod downloader for the planted</text>
    <text x="76" y="651" font-size="18" fill="#ffffff">payload</text>
    <text x="76" y="686" font-size="17" font-weight="600" fill="#fb923c">Planted payload: not held</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="60" y="755" width="340" height="200" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="755" width="340" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="788" width="340" height="13" fill="#7f1d1d"/>
    <text x="76" y="785" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STAGE 6 · REVERSE SOCKS RELAY</text>
    <text x="76" y="837" font-size="18" fill="#ffffff">Takes a host and port line, pipes</text>
    <text x="76" y="864" font-size="18" fill="#ffffff">a socket to it; the relay, not the</text>
    <text x="76" y="891" font-size="18" fill="#ffffff">platform, chooses targets</text>
    <text x="76" y="926" font-size="17" font-weight="600" fill="#fb923c">No log names a worker host</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="600" y="275" width="340" height="240" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="600" y="275" width="340" height="46" rx="8" fill="#f97316"/>
    <rect x="600" y="308" width="340" height="13" fill="#f97316"/>
    <text x="616" y="305" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STAGES 1-3 · AGENT PLATFORM</text>
    <text x="616" y="357" font-size="18" fill="#ffffff">Token minted, private agent</text>
    <text x="616" y="384" font-size="18" fill="#ffffff">registered, config.json written</text>
    <text x="616" y="411" font-size="18" fill="#ffffff">with llm.baseUrl set to the</text>
    <text x="616" y="438" font-size="18" fill="#ffffff">operator endpoint, then reloaded</text>
    <text x="616" y="473" font-size="17" font-weight="600" fill="#fb923c">Captured 200s, MODERATE</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="600" y="610" width="340" height="215" rx="8" fill="#1a1a1a" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="600" y="610" width="340" height="46" rx="8" fill="#dc2626"/>
    <rect x="600" y="643" width="340" height="13" fill="#dc2626"/>
    <text x="616" y="640" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STAGE 5 · MCP STDIO PLANT</text>
    <text x="616" y="692" font-size="18" fill="#ffffff">Workspace file declares a stdio</text>
    <text x="616" y="719" font-size="18" fill="#ffffff">tool server, no model involved;</text>
    <text x="616" y="746" font-size="18" fill="#ffffff">command is python3 -c with a</text>
    <text x="616" y="773" font-size="18" fill="#ffffff">one-line downloader</text>
    <text x="616" y="808" font-size="17" font-weight="600" fill="#fb923c">Delivery: not shown</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="600" y="860" width="340" height="125" rx="8" fill="#1a1a1a" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="600" y="860" width="340" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="600" y="893" width="340" height="13" fill="#7f1d1d"/>
    <text x="616" y="890" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STAGE 6 · SOCKS WORKER</text>
    <text x="616" y="942" font-size="18" fill="#ffffff">Dials the operator relay</text>
  </g>
  <polyline points="420,390 598,390" fill="none" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="510" cy="390" r="15" fill="#161616" stroke="#cccccc" stroke-width="2"/>
  <text x="510" y="396" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <polyline points="840,515 840,553" fill="none" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="890" cy="534" r="15" fill="#161616" stroke="#cccccc" stroke-width="2"/>
  <text x="890" y="540" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <polyline points="580,578 500,578 500,445 402,445" fill="none" stroke="#cccccc" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
  <circle cx="500" cy="512" r="15" fill="#161616" stroke="#cccccc" stroke-width="2"/>
  <text x="500" y="518" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <polyline points="598,700 402,700" fill="none" stroke="#cccccc" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
  <circle cx="500" cy="700" r="15" fill="#161616" stroke="#cccccc" stroke-width="2"/>
  <text x="500" y="706" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
  <polyline points="598,920 402,920" fill="none" stroke="#cccccc" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
  <circle cx="500" cy="920" r="15" fill="#161616" stroke="#cccccc" stroke-width="2"/>
  <text x="500" y="926" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">5</text>
  <line x1="770" y1="825" x2="770" y2="858" stroke="#cccccc" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
  <line x1="60" y1="1030" x2="940" y2="1030" stroke="#2a2a2a" stroke-width="1"/>
  <text x="60" y="1062" font-size="20" font-weight="700" fill="#ffffff">LINKS</text>
  <text x="60" y="1096" font-size="17" fill="#e5e5e5">1  Solid: operator scripts mint a token and write the config to the platform</text>
  <text x="60" y="1128" font-size="17" fill="#e5e5e5">2  Solid: the reload route pushes the new config into the running pod</text>
  <text x="60" y="1160" font-size="17" fill="#e5e5e5">3  Dashed: the pod's model turns reach the endpoint, which answers with tool calls</text>
  <text x="60" y="1192" font-size="17" fill="#e5e5e5">4  Dashed: the plant's downloader fetches the worker (delivery not shown)</text>
  <text x="60" y="1224" font-size="17" fill="#e5e5e5">5  Dashed: the worker dials the operator relay (no log names a worker host)</text>
  <line x1="60" y1="1262" x2="940" y2="1262" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1292" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Detection anchors: an agent model base URL outside the platform catalogue;</text>
  <text x="500" y="1316" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">a tool-server entry whose command is an inline interpreter call</text>
  <rect x="60" y="1338" width="14" height="14" rx="2" fill="#f97316"/>
  <text x="82" y="1351" font-size="14" fill="#cccccc">platform write</text>
  <rect x="220" y="1338" width="14" height="14" rx="2" fill="#dc2626"/>
  <text x="242" y="1351" font-size="14" fill="#cccccc">operator code</text>
  <rect x="370" y="1338" width="14" height="14" rx="2" fill="#eab308"/>
  <text x="392" y="1351" font-size="14" fill="#cccccc">payload</text>
  <rect x="470" y="1338" width="14" height="14" rx="2" fill="#7f1d1d"/>
  <text x="492" y="1351" font-size="14" fill="#cccccc">relay</text>
  <rect x="560" y="1338" width="26" height="14" rx="2" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="594" y="1351" font-size="14" fill="#cccccc">dashed = inferred or not shown</text>
</svg>
