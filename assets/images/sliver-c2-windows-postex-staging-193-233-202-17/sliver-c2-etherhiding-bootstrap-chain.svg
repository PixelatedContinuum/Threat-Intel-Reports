<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1000" height="1640" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1639" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">The EtherHiding Bootstrap Chain</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">How a legitimate Node runtime becomes the attacker's interpreter</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">Delivered by a 26 KB MSI; nothing past Stage 1 is a Windows executable</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>

  <!-- STEP 1 - orange -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="196" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="196" width="880" height="46" rx="8" fill="#f97316"/>
    <rect x="60" y="229" width="880" height="13" fill="#f97316"/>
    <text x="80" y="227" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 1</text>
    <text x="200" y="227" font-size="23" font-weight="600" fill="#111111">Bring Your Own Runtime</text>
    <text x="80" y="282" font-size="21" fill="#ffffff">A 546-byte bootstrapper checks for Node, then fetches the real runtime</text>
    <text x="80" y="316" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">nodejs.org/dist/v18.17.0/node-v18.17.0-win-x64.zip</text>
    <text x="80" y="350" font-size="18" fill="#e5e5e5">curl.exe and tar.exe unpack it, both signed Microsoft binaries</text>
    <text x="80" y="384" font-size="18" fill="#fb923c" font-weight="600">Detect: node.exe launched from a script, not a browser</text>
  </g>
  <line x1="500" y1="416" x2="500" y2="456" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 2 - red -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="462" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="462" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="495" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="493" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 2</text>
    <text x="200" y="493" font-size="23" font-weight="600" fill="#ffffff">Decrypt and Persist</text>
    <text x="80" y="548" font-size="21" fill="#ffffff">840 bytes of JavaScript, XOR with a 64-byte key plus a counter</text>
    <text x="80" y="582" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">o[i] = e[i] ^ k[i % k.length] ^ (i &amp; 255)</text>
    <text x="80" y="616" font-size="18" fill="#e5e5e5">Persists as a Run key launching node.exe with conhost --headless</text>
    <text x="80" y="650" font-size="18" fill="#fb923c" font-weight="600">Detect: node.exe from %LOCALAPPDATA% under a headless Run key</text>
  </g>
  <line x1="500" y1="682" x2="500" y2="722" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 3 - yellow -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="728" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="728" width="880" height="46" rx="8" fill="#eab308"/>
    <rect x="60" y="761" width="880" height="13" fill="#eab308"/>
    <text x="80" y="759" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 3</text>
    <text x="200" y="759" font-size="23" font-weight="600" fill="#111111">Resolve C2 by Majority Vote</text>
    <text x="80" y="814" font-size="21" fill="#ffffff">eth_call sent to seven public Ethereum RPC providers, in parallel</text>
    <text x="80" y="848" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">selector 0x7d434425, majority vote across all seven answers</text>
    <text x="80" y="882" font-size="18" fill="#e5e5e5">One hostile or misconfigured provider cannot redirect the bot</text>
    <text x="80" y="916" font-size="18" fill="#fb923c" font-weight="600">Detect: outbound eth_call from a non-developer, non-browser process</text>
  </g>
  <line x1="500" y1="948" x2="500" y2="988" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 4 - deep red -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="994" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="994" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1027" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1025" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 4</text>
    <text x="200" y="1025" font-size="23" font-weight="600" fill="#ffffff">Execute Whatever Comes Back</text>
    <text x="80" y="1080" font-size="21" fill="#ffffff">Any response over 10 bytes runs as an AsyncFunction, full Node API</text>
    <text x="80" y="1114" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">Object.getPrototypeOf(async function(){}).constructor</text>
    <text x="80" y="1148" font-size="18" fill="#fb923c" font-weight="600">Detect: POST to a static-asset-shaped path, single-letter query key</text>
    <text x="80" y="1180" font-size="18" fill="#fb923c" font-weight="600">Server re-obfuscates the bot's own source on first run, per victim</text>
  </g>

  <line x1="60" y1="1260" x2="940" y2="1260" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1294" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Detection anchors: conhost --headless Run key, X-Bot-Server header</text>
  <text x="500" y="1324" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">single-letter query parameter on a static-asset-shaped POST path</text>
  <text x="500" y="1360" text-anchor="middle" font-size="15" fill="#cccccc">The bot re-obfuscates its own source server-side, so no two victims run a hash-matchable copy</text>
  <text x="500" y="1392" text-anchor="middle" font-size="14" fill="#888888">Legend: orange = initial trigger · red = operator code · yellow = payload retrieval · deep red = endgame</text>
</svg>
