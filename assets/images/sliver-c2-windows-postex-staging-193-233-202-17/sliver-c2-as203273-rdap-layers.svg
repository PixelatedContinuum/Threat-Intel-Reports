<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1000" height="1640" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1639" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">The Host Has No One Country</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">Four RDAP objects, four different answers, all correct</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">Read top to bottom: each layer is a separate registry object with its own facts</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>

  <!-- LAYER 1 - grey: the ASN -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="196" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="196" width="880" height="46" rx="8" fill="#6b7280"/>
    <rect x="60" y="229" width="880" height="13" fill="#6b7280"/>
    <text x="80" y="227" font-size="17" font-weight="700" fill="#cccccc" letter-spacing="0.5">LAYER 1</text>
    <text x="220" y="227" font-size="23" font-weight="600" fill="#cccccc">AS203273, NetCraftersOU</text>
    <text x="80" y="282" font-size="21" fill="#ffffff">No country field anywhere on the ASN object itself</text>
    <text x="80" y="316" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">registrant declares Kohtla-Jarve, Ida-Viru maakond, Estonia</text>
    <text x="80" y="350" font-size="18" fill="#e5e5e5">"Estonian" is a declared address plus an OU company-form inference</text>
    <text x="80" y="384" font-size="18" fill="#fb923c" font-weight="600">A declared address is the registrant's own claim, not a registry field</text>
  </g>
  <line x1="500" y1="416" x2="500" y2="456" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 2 - grey: the /23 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="462" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="462" width="880" height="46" rx="8" fill="#6b7280"/>
    <rect x="60" y="495" width="880" height="13" fill="#6b7280"/>
    <text x="80" y="493" font-size="17" font-weight="700" fill="#cccccc" letter-spacing="0.5">LAYER 2</text>
    <text x="220" y="493" font-size="23" font-weight="600" fill="#cccccc">/23 Sub-Allocation, AGROSNAB-NET-233-202</text>
    <text x="80" y="548" font-size="21" fill="#ffffff">A separate object, one step down, with its own explicit country field</text>
    <text x="80" y="582" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">country RU, registrant OOO AGROSNAB, Yekaterinburg</text>
    <text x="80" y="616" font-size="18" fill="#e5e5e5">A Russian reseller sub-allocation sitting inside the Estonian ASN</text>
    <text x="80" y="650" font-size="18" fill="#fb923c" font-weight="600">Type SUB-ALLOCATED PA, not yet the object that covers our host</text>
  </g>
  <line x1="500" y1="682" x2="500" y2="722" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 3 - yellow: the /24, most specific -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="728" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="728" width="880" height="46" rx="8" fill="#eab308"/>
    <rect x="60" y="761" width="880" height="13" fill="#eab308"/>
    <text x="80" y="759" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">LAYER 3</text>
    <text x="220" y="759" font-size="23" font-weight="600" fill="#111111">/24 Assignment, Netcrafters-OU (most specific)</text>
    <text x="80" y="814" font-size="21" fill="#ffffff">The object that actually covers 193.233.202.17, and it disagrees</text>
    <text x="80" y="848" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">type ASSIGNED PA, country US, one layer inside the Russian /23</text>
    <text x="80" y="882" font-size="18" fill="#e5e5e5">The most-specific object is the one that should govern a lookup</text>
    <text x="80" y="916" font-size="18" fill="#fb923c" font-weight="600">Live GeoIP tools read whichever layer their database last cached</text>
  </g>
  <line x1="500" y1="948" x2="500" y2="988" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 4 - deep red: synthesis -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="994" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="994" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1027" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1025" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">SYNTHESIS</text>
    <text x="290" y="1025" font-size="23" font-weight="600" fill="#ffffff">Never Write a Single Country</text>
    <text x="80" y="1080" font-size="21" fill="#ffffff">One maintainer, mnt-ru-am-1, holds both the /23 and the /24</text>
    <text x="80" y="1114" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">Securebit AG appears too, a RIPE sponsoring LIR, not a link</text>
    <text x="80" y="1148" font-size="18" fill="#fb923c" font-weight="600">Report the layers, not a verdict: RU, US and no-field are all real</text>
    <text x="80" y="1180" font-size="18" fill="#fb923c" font-weight="600">The Russian and US-flagged objects are not arm's-length parties</text>
  </g>

  <line x1="60" y1="1260" x2="940" y2="1260" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1294" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Detection anchors: none, this is a registration-mechanics finding</text>
  <text x="500" y="1324" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">not an indicator to hunt on</text>
  <text x="500" y="1360" text-anchor="middle" font-size="15" fill="#cccccc">Verified directly against the raw RDAP objects, re-derived independently twice with identical results</text>
  <text x="500" y="1392" text-anchor="middle" font-size="14" fill="#888888">Legend: grey = registry object · yellow = the object that governs this host · deep red = the reading to publish</text>
</svg>
