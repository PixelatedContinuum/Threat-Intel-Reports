<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="treeShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1000" height="2000" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1999" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">Monitoring Server as a Command Plane</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">One stolen staff account, temporary scripts, then clean-up</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">Network behind the proxy not established, so not added to the agency's row</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="196" width="880" height="251" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="196" width="880" height="46" rx="8" fill="#f97316"/>
    <rect x="60" y="229" width="880" height="13" fill="#f97316"/>
    <text x="80" y="227" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 1</text>
    <text x="175" y="227" font-size="23" font-weight="600" fill="#111111">One stolen staff account on the Zabbix server</text>
    <text x="80" y="278" font-size="19" fill="#ffffff">The same account and password appear in 110 of the 534 file hashes in the operator's</text>
    <text x="80" y="304" font-size="19" fill="#ffffff">later script batches.</text>
    <text x="80" y="336" font-size="17" fill="#e5e5e5">The scripts reach the Zabbix API and web frontend through a local SOCKS listener on the</text>
    <text x="80" y="360" font-size="17" fill="#e5e5e5">operator's own host.</text>
    <text x="80" y="389" font-size="15" fill="#cccccc">The account name matches the local part of an agency e-mail address in the EDR console's user list:</text>
    <text x="80" y="410" font-size="15" fill="#cccccc">MODERATE, an association and not proof of ownership.</text>
  </g>
  <line x1="500" y1="447" x2="500" y2="487" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="493" width="880" height="208" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="493" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="526" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="524" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 2</text>
    <text x="175" y="524" font-size="23" font-weight="600" fill="#ffffff">Create temporary global scripts and command items</text>
    <text x="80" y="575" font-size="19" fill="#ffffff">Of 76 scripts read in full: 36 only read inventory or poll, 37 create items or</text>
    <text x="80" y="601" font-size="19" fill="#ffffff">scripts that run commands on monitored hosts, 3 delete the operator's own objects.</text>
    <text x="80" y="633" font-size="16" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace" fill="#e5e5e5">z-revtest z-dbcred z-srvrec4 z-satsudo diag-04 to diag-06</text>
    <text x="80" y="662" font-size="17" font-weight="700" fill="#fb923c">Prefixes z-, wv3_ and poc; item identifiers 96795 and 96797 to 96802.</text>
  </g>
  <line x1="500" y1="701" x2="500" y2="741" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="728" font-size="15" font-weight="700" fill="#fb923c">run on a monitoring proxy</text>
  <g filter="url(#cardShadow)">
    <rect x="60" y="747" width="880" height="198" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="747" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="780" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="778" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 3</text>
    <text x="175" y="778" font-size="23" font-weight="600" fill="#ffffff">Commands run on the monitoring proxy</text>
    <text x="80" y="829" font-size="19" fill="#ffffff">The scripts run the commands on a monitoring proxy, with the result sent to the</text>
    <text x="80" y="855" font-size="19" fill="#ffffff">operator's own listener.</text>
    <text x="80" y="887" font-size="15" fill="#cccccc">Whose network the proxy sits in is not established, so it is graded COMPROMISED at MODERATE and not added to</text>
    <text x="80" y="908" font-size="15" fill="#cccccc">the agency's row.</text>
  </g>
  <line x1="500" y1="945" x2="500" y2="985" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="972" font-size="15" font-weight="700" fill="#fb923c">join of script to callback: MODERATE</text>
  <g filter="url(#cardShadow)">
    <rect x="60" y="991" width="880" height="154" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="991" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1024" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1022" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 4</text>
    <text x="175" y="1022" font-size="23" font-weight="600" fill="#ffffff">Root identity returned to the operator</text>
    <text x="80" y="1073" font-size="19" fill="#ffffff">Root identity and a hostname came back from the proxy to 38.180.16[.]98 on port 9090.</text>
    <text x="80" y="1105" font-size="17" font-weight="700" fill="#fb923c">One callback is held; the listener on port 9090 is the operator's.</text>
  </g>
  <line x1="500" y1="1145" x2="500" y2="1185" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="1191" width="880" height="180" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="1191" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="1224" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="1222" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 5</text>
    <text x="175" y="1222" font-size="23" font-weight="600" fill="#ffffff">The operator deletes its own objects</text>
    <text x="80" y="1273" font-size="19" fill="#ffffff">Cleanup of its own monitoring objects is the only anti-forensic step that left a</text>
    <text x="80" y="1299" font-size="19" fill="#ffffff">trace.</text>
    <text x="80" y="1331" font-size="17" font-weight="700" fill="#fb923c">The Zabbix audit log is where creation and deletion show.</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="60" y="1411" width="880" height="277" rx="8" fill="#1a1a1a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="60" y="1411" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="1444" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="1442" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">INTENT</text>
    <text x="175" y="1442" font-size="23" font-weight="600" fill="#ffffff">Requested of monitored hosts, no output held</text>
    <text x="80" y="1493" font-size="19" fill="#ffffff">Shell histories, directory-service and database configuration, SSH material, SNMP</text>
    <text x="80" y="1519" font-size="19" fill="#ffffff">community strings, cloud instance-metadata roles, and egress tests to the operator's</text>
    <text x="80" y="1545" font-size="19" fill="#ffffff">servers.</text>
    <text x="80" y="1578" font-size="17" fill="#e5e5e5">A listener on port 9443 was meant to receive a path map of the proxy host: only its startup</text>
    <text x="80" y="1601" font-size="17" fill="#e5e5e5">line is held, no arrival is shown.</text>
    <text x="80" y="1631" font-size="15" fill="#cccccc">The same account and password were tried at further services; no reply to any is held. This shows intent and</text>
    <text x="80" y="1651" font-size="15" fill="#cccccc">capability, not harvested credentials.</text>
  </g>
  <line x1="60" y1="1728" x2="940" y2="1728" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1762" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Detection anchors:  Zabbix audit log, global scripts or command items created,</text>
  <text x="500" y="1792" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">run and deleted by one ordinary account within a short window</text>
  <text x="500" y="1826" text-anchor="middle" font-size="15" fill="#cccccc">Names to search: z-, wv3_ and poc prefixes · diag-04 to diag-06 · items 96795 and 96797 to 96802</text>
  <rect x="60" y="1853" width="16" height="16" fill="#f97316"/>
  <text x="84" y="1866" font-size="14" fill="#cccccc">access</text>
  <rect x="156" y="1853" width="16" height="16" fill="#dc2626"/>
  <text x="180" y="1866" font-size="14" fill="#cccccc">operator code</text>
  <rect x="306" y="1853" width="16" height="16" fill="#7f1d1d"/>
  <text x="330" y="1866" font-size="14" fill="#cccccc">callback to the operator</text>
  <rect x="540" y="1853" width="16" height="16" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="564" y="1866" font-size="14" fill="#cccccc">no output held</text>
  <text x="500" y="1900" text-anchor="middle" font-size="14" fill="#888888">The technique is documented prior art and fingerprints no operator. Its value here is as defender guidance.</text>
</svg>
