<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1850" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="treeShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1000" height="1850" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1849" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">Bank Tunnel Inside the API Gateway</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">ACCESS SHOWN, with each link graded at its own confidence</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">Dashed links and cards are inferred or NOT CHECKED, and carry no weight in the grade</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="196" width="880" height="251" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="196" width="880" height="46" rx="8" fill="#f97316"/>
    <rect x="60" y="229" width="880" height="13" fill="#f97316"/>
    <text x="80" y="227" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 1</text>
    <text x="175" y="227" font-size="23" font-weight="600" fill="#111111">Entry into the WSO2 API Manager: inferred</text>
    <text x="80" y="278" font-size="19" fill="#ffffff">The operator's scripts are aimed at CVE-2022-29464, an unauthenticated file-upload</text>
    <text x="80" y="304" font-size="19" fill="#ffffff">flaw in WSO2 products.</text>
    <text x="80" y="336" font-size="17" fill="#e5e5e5">No response in the directory shows the flaw working, so entry by that CVE is an inference, not</text>
    <text x="80" y="360" font-size="17" fill="#e5e5e5">a finding.</text>
    <text x="80" y="389" font-size="15" fill="#cccccc">Four JSPs listed in the authenticationendpoint and oauth2 web applications (Sep 15): placement LOW-MODERATE,</text>
    <text x="80" y="410" font-size="15" fill="#cccccc">contents and creator unseen, so they do not carry the grade.</text>
  </g>
  <line x1="500" y1="447" x2="500" y2="487" stroke="#cccccc" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="520" y="474" font-size="15" font-weight="700" fill="#fb923c">inferred route</text>
  <g filter="url(#cardShadow)">
    <rect x="60" y="493" width="880" height="233" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="493" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="526" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="524" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 2</text>
    <text x="175" y="524" font-size="23" font-weight="600" fill="#ffffff">Command output inside the container: HIGH</text>
    <text x="80" y="575" font-size="19" fill="#ffffff">Identity, host and date output run as the WSO2 service account, stamped 2026-09-15</text>
    <text x="80" y="601" font-size="19" fill="#ffffff">17:06:41 UTC.</text>
    <text x="80" y="633" font-size="17" fill="#e5e5e5">The same process appears in three process tables (16:25, 16:26, 17:06); a compiled /tmp/Q.class</text>
    <text x="80" y="657" font-size="17" fill="#e5e5e5">owned by the service account.</text>
    <text x="80" y="686" font-size="17" font-weight="700" fill="#fb923c">This host-side evidence is what grades the bank ACCESS SHOWN.</text>
  </g>
  <line x1="500" y1="726" x2="500" y2="766" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#cardShadow)">
    <rect x="60" y="772" width="880" height="233" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="772" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="805" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="803" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 3</text>
    <text x="175" y="803" font-size="23" font-weight="600" fill="#ffffff">Reverse-SOCKS client /tmp/upd is running</text>
    <text x="80" y="854" font-size="19" fill="#ffffff">PID 7519, run by the WSO2 service account, start labelled Sep 14 (no year or zone in</text>
    <text x="80" y="880" font-size="19" fill="#ffffff">the table).</text>
    <text x="80" y="912" font-size="17" fill="#e5e5e5">Chisel-style client, by its flags aimed at 209.99.185[.]148 over HTTPS through the bank's own</text>
    <text x="80" y="936" font-size="17" fill="#e5e5e5">forward proxy.</text>
    <text x="80" y="965" font-size="17" font-weight="700" fill="#fb923c">Process exists: HIGH. Operator started it: MODERATE.</text>
  </g>
  <line x1="500" y1="1005" x2="500" y2="1045" stroke="#cccccc" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="520" y="1032" font-size="15" font-weight="700" fill="#fb923c">NOT CHECKED beyond this line</text>
  <g filter="url(#cardShadow)">
    <rect x="60" y="1051" width="880" height="207" rx="8" fill="#1a1a1a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="60" y="1051" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1084" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1082" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 4</text>
    <text x="175" y="1082" font-size="23" font-weight="600" fill="#ffffff">Far end: the operator's server</text>
    <text x="80" y="1133" font-size="19" fill="#ffffff">209.99.185[.]148, the operator's server.</text>
    <text x="80" y="1165" font-size="17" fill="#e5e5e5">Whether that server accepted the connection, whether the proxy accepted the credential and</text>
    <text x="80" y="1189" font-size="17" fill="#e5e5e5">whether any traffic crossed are all NOT CHECKED.</text>
    <text x="80" y="1218" font-size="17" font-weight="700" fill="#fb923c">Only the bank's proxy logs can answer.</text>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="60" y="1298" width="880" height="251" rx="8" fill="#1a1a1a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="60" y="1298" width="880" height="46" rx="8" fill="#eab308"/>
    <rect x="60" y="1331" width="880" height="13" fill="#eab308"/>
    <text x="80" y="1329" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">HELD</text>
    <text x="155" y="1329" font-size="23" font-weight="600" fill="#111111">Gateway material, route out not shown</text>
    <text x="80" y="1380" font-size="19" fill="#ffffff">Unencrypted private key of the WSO2 service keystore; 608 OAuth client key and secret</text>
    <text x="80" y="1406" font-size="19" fill="#ffffff">pairs (460 owner labels).</text>
    <text x="80" y="1438" font-size="17" fill="#e5e5e5">A 966-row subscription dump (480 subscriber identities, 25 APIs); a 200-line user listing from</text>
    <text x="80" y="1462" font-size="17" fill="#e5e5e5">a population of 1,077; an 80-token sample of 833 active tokens.</text>
    <text x="80" y="1491" font-size="15" fill="#cccccc">Samples are smaller than their populations and must not be added together. Whether any credential is still</text>
    <text x="80" y="1512" font-size="15" fill="#cccccc">valid is unchecked, and how the key left the host is not shown.</text>
  </g>
  <line x1="60" y1="1589" x2="940" y2="1589" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1623" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Detection anchors:  an application service account holding HTTPS to a hard-coded</text>
  <text x="500" y="1653" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">external address through the organisation's own forward proxy (the proxy's CONNECT log)</text>
  <text x="500" y="1687" text-anchor="middle" font-size="15" fill="#cccccc">Also: /tmp/upd running as an application service account · /tmp/Q.class · unexplained JSPs in WSO2 web applications</text>
  <rect x="60" y="1714" width="16" height="16" fill="#f97316"/>
  <text x="84" y="1727" font-size="14" fill="#cccccc">entry (inferred)</text>
  <rect x="233" y="1714" width="16" height="16" fill="#dc2626"/>
  <text x="257" y="1727" font-size="14" fill="#cccccc">execution in the container</text>
  <rect x="483" y="1714" width="16" height="16" fill="#7f1d1d"/>
  <text x="507" y="1727" font-size="14" fill="#cccccc">far end of the tunnel</text>
  <rect x="694" y="1714" width="16" height="16" fill="#eab308"/>
  <text x="718" y="1727" font-size="14" fill="#cccccc">held material</text>
  <rect x="60" y="1740" width="16" height="16" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="84" y="1753" font-size="14" fill="#cccccc">not shown / NOT CHECKED</text>
  <text x="500" y="1787" text-anchor="middle" font-size="14" fill="#888888">Latest dated host-side evidence at the bank: 2026-09-15. Whether any of the access still works is unknown.</text>
</svg>
