<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1409.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1000" height="1409.5" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1408.5" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- TITLE -->
  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">The escalation ladder</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">Six gated stages, each a precondition for the next</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">Every one of the 198 confirmed hosts passed every earlier gate</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>

  <!-- STEP 1 orange -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="196" width="880" height="138.25" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="196" width="880" height="46" rx="8" fill="#f97316"/>
    <rect x="60" y="229" width="880" height="13" fill="#f97316"/>
    <text x="80" y="227" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 1</text>
    <text x="200" y="227" font-size="23" font-weight="600" fill="#111111">Liveness and fingerprinting</text>
    <text x="80" y="282" font-size="21" fill="#ffffff">All 206 candidates probed through a local SOCKS5 proxy</text>
    <text x="80" y="316" font-size="18" fill="#e5e5e5">Confirms the host is up and selects the Gotenberg version band</text>
  </g>
  <line x1="500" y1="334.25" x2="500" y2="374.25" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 2 red -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="380.25" width="880" height="138.25" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="380.25" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="413.25" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="411.25" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 2</text>
    <text x="200" y="411.25" font-size="23" font-weight="600" fill="#ffffff">Timing-based RCE confirmation</text>
    <text x="80" y="466.25" font-size="21" fill="#ffffff">A baseline write timed against an injected one; 70% of the delay counts</text>
    <text x="80" y="500.25" font-size="18" fill="#e5e5e5">The blind-timing method is copied from a public proof-of-concept</text>
  </g>
  <line x1="500" y1="518.5" x2="500" y2="558.5" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 3 red -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="564.5" width="880" height="138.25" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="564.5" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="597.5" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="595.5" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 3</text>
    <text x="200" y="595.5" font-size="23" font-weight="600" fill="#ffffff">Out-of-band callback</text>
    <text x="80" y="650.5" font-size="21" fill="#ffffff">The command curls back with a tag from the host's own hostname and UID</text>
    <text x="80" y="684.5" font-size="18" fill="#e5e5e5">What makes 198 simultaneous callbacks individually attributable</text>
  </g>
  <line x1="500" y1="702.75" x2="500" y2="742.75" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 4 red -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="748.75" width="880" height="138.25" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="748.75" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="781.75" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="779.75" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 4</text>
    <text x="200" y="779.75" font-size="23" font-weight="600" fill="#ffffff">Three-transport retry</text>
    <text x="80" y="834.75" font-size="21" fill="#ffffff">wget, then curl, then nc, for any host that missed the first callback</text>
    <text x="80" y="868.75" font-size="18" fill="#e5e5e5">Each transport tags its own callback, recording which binary existed</text>
  </g>
  <line x1="500" y1="887" x2="500" y2="927" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 5 yellow -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="933" width="880" height="138.25" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="933" width="880" height="46" rx="8" fill="#eab308"/>
    <rect x="60" y="966" width="880" height="13" fill="#eab308"/>
    <text x="80" y="964" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 5</text>
    <text x="200" y="964" font-size="23" font-weight="600" fill="#111111">Pre-deployment recon</text>
    <text x="80" y="1019" font-size="21" fill="#ffffff">Checks for rival miners, free space in /tmp, and actually touches /tmp/.wt</text>
    <text x="80" y="1053" font-size="18" fill="#e5e5e5">One host returned Permission denied here; the operator logged it and moved on</text>
  </g>
  <line x1="500" y1="1071.25" x2="500" y2="1111.25" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 6 deep red -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="1117.25" width="880" height="138.25" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="1117.25" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1150.25" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1148.25" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 6</text>
    <text x="200" y="1148.25" font-size="23" font-weight="600" fill="#ffffff">Deployment</text>
    <text x="80" y="1203.25" font-size="21" fill="#ffffff">Only after every prior gate passed</text>
    <text x="80" y="1237.25" font-size="18" fill="#e5e5e5">148 to 151 confirmed installs; see Section 5 for the two install modes</text>
  </g>

  <!-- FOOTER -->
  <line x1="60" y1="1295.5" x2="940" y2="1295.5" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1329.5" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Skip any gate and the operator wastes a deploy slot, so none were skipped</text>
  <text x="500" y="1359.5" text-anchor="middle" font-size="15" fill="#cccccc">Full narrative: Section 4, "The window: 54 minutes, and the deliberate ordering around it"</text>
  <text x="500" y="1383.5" text-anchor="middle" font-size="14" fill="#888888">Legend: orange = scoping · red = confirmation · yellow = staging · deep red = deployment</text>
</svg>