# Threat actor records for /actors/ and /actors/<id>/.
#
# One entry per UTA designation (Unattributed Threat Actor) that a published
# report assigns. Everything here is a SUMMARY of what the linked reports
# already say, written for a reader landing on the actor page first: the
# report is the record, this file never carries a claim the report does not.
# Confidence levels and percentages are the published report's figures, not
# the private tracking file's, which can move between publications.
#
# What is deliberately NOT here: operator handles, account identifiers,
# wallets, credentials and victim names. Those belong to the report's own
# sections and IOC feed, where they sit beside the caveats that qualify them.
# An actor page lists only the host the report is named for.
#
# Fields:
#   id             the designation, UTA-YYYY-NNN
#   status         active | merged | retired (the published lifecycle)
#   first_observed first report date the designation was assigned in
#   last_updated   date of the latest published change to the assessment
#   type           one line on what the operator does
#   motivation     as assessed in the report
#   language       operator language where the report assesses one, with its level
#   confidence     distinct_actor: level the report holds for "one trackable
#                  operator", distinct_actor_pct when the report gives a figure;
#                  named_actor: level for linking to a publicly named group
#   alias          a vendor tracking label the report pairs with the designation
#   summary        two or three sentences, plain language
#   primary_host   the IP the assigning report is named for (operator-controlled)
#   tooling        malware families and frameworks named in the report
#   reports        primary: the reports about this actor, url list. Every other
#                  published mention is discovered by the generator.
#   related        other designations the report relates this one to, with the
#                  published relation in one line
#
# An embargoed actor (one whose only report is unlisted) is kept out of this
# file until go-live, exactly as its catalog entry is; the generator refuses to
# build a page for one anyway. generate-actors.js and check-actors.js in
# tools/report-tooling gate the file against the reports.
