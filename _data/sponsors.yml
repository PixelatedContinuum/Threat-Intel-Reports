tiers:
  - id: monthly
    name: Monthly Sponsor
    price: "$500"
    price_note: "Per Month"
    intro_price: "New sponsors: first 3 months $300/mo, or a first full year at $4,400"
    annual_price: "$5,000"
    annual_note: "per year, paid up front"
    annual_saving: "Two months free, a $1,000 saving (17% off)"
    billing_note: "Monthly or annual, whichever suits your budget cycle. Annual prepay is 17% cheaper, locks your rate for the term, and unlocks the threat question straight away. On monthly it unlocks at twelve months."
    description: "Flagship, always-on presence, and the strongest value per dollar. Standing brand presence across the whole site, for as long as you sponsor."
    benefits:
      - "Logo and tagline in the left-margin Sponsors panel on every page and report, a standing, high-visibility placement"
      - "Logo and a dofollow link in the site footer on every page, plus a featured slot in the Sponsors section"
      - "Early access to the whole package before it goes public, the report and its detection rules and its IOC feed, plus first option to sponsor any upcoming report exclusively"
      - "A welcome announcement post when you join, plus a quarterly sponsor spotlight post, with extra posts any time at the add-on rate"
      - "A one-time feature in a single report during your first month"
      - "Your logo in the subscriber email newsletter"
      - "One threat question answered a year. Bring an indicator, a domain, or a threat you are unsure about and I go and look, then send you the written answer and the evidence behind it. A clean result is an answer too"
      - "Your rate is locked for as long as you keep sponsoring. Renew without a break and a published price rise never reaches you"
      - "An Official Sponsor badge for your own site and marketing, yours for as long as the sponsorship runs"
    best_fit: "Sponsors who want ongoing, site-wide brand association with the publication, visible to every reader, for as long as you sponsor."
    slots: 3
  - id: report
    name: Report Sponsor
    price: "$150"
    price_note: "New Report"
    intro_price: "New sponsors: first new report $100"
    catalog_price: "$100"
    catalog_price_note: "From the Catalog (33% off the new-report rate)"
    annual_price: "$1,170"
    annual_note: "Year of Reports, 12 new reports across 12 months"
    annual_saving: "A $630 saving (35% off the new-report rate)"
    billing_note: "Buy one at a time, bundle 3, 6 or 12, or take a full year at the deepest rate. Bundle pricing is against the new-report rate; catalog reports are $100 each whenever you buy them."
    description: "Exclusive single-report placement, one sponsor per report, no competing logos. Pick a new report at $150 or a catalog report at $100; catalog reports keep drawing search traffic long after publication."
    benefits:
      - "Sole Sponsored-by banner at the top of the report, exclusive, no competing logos"
      - "Logo and a dofollow link to your site or chosen landing page"
      - "Permanent for the life of the report. It never expires, and keeps surfacing in search and hunts"
      - "The report's launch post credits you (LinkedIn, X, and subscriber email)"
      - "Early access before it goes public, and not just the report. The detection rules and the IOC feed come with it"
      - "You pick which report you sponsor, from anything already published or on the schedule"
      - "Bundle &amp; save on new reports: 3 for $335 &middot; 6 for $630 &middot; 12 for $1,170 across a full year. Catalog reports stay $100 each, bundled or not"
    best_fit: "Sponsors who want exclusive association with a specific report or threat, with sole placement, permanent for its life."
    slots: 3

