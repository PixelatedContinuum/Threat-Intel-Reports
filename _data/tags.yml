# Controlled vocabulary for the catalog tags in _data/catalog.yml.
#
# Why this exists. The listing filter builds its chips from tags that appear on
# three or more entries, and tag-badge.html picks a badge colour by tag name. Both
# compare strings exactly, so "Open Dir" and "OpenDirectory" were two different
# tags to the site: neither reached the chip threshold on its own, and the drift
# was invisible from any one catalog entry. This file is the one place the
# spelling is decided.
#
# Every entry has a `tag` (the canonical spelling, exactly as it must appear in
# the catalog), a `color` (one of blue, red, green, purple, yellow; the badge
# palette in assets/css/custom.scss), and optionally `aliases`: spellings that
# have appeared before and must NOT be used again. check-tags.js in
# tools/report-tooling FAILS a commit whose catalog carries an alias, and warns
# by name on a tag this file does not know, so a new tag is added here
# deliberately rather than slipping in as a near-duplicate.
#
# Keep the canonical form short, since a badge is a chip and a chip row has a
# dozen of them: "Cred Theft" not "Credential Theft", "Post-Ex" not
# "Post-Exploitation", "Open Dir" not "OpenDirectory".

tags:
  # ---- what was found / campaign type ----
  - tag: Open Dir
    color: green
    aliases: [OpenDirectory, Open Directory, OpenDir]
  - tag: C2
    color: blue
  - tag: RAT
    color: blue
  - tag: Loader
    color: purple
  - tag: Dropper
    color: purple
  - tag: Stealer
    color: purple
  - tag: Ransomware
    color: red
  - tag: Rootkit
    color: red
  - tag: Botnet
    color: red
  - tag: Webshell
    color: red
  - tag: Toolkit
    color: red
    aliases: [Intrusion Toolkit]
  - tag: Scanner
    color: green
  - tag: Builder
    color: blue
  - tag: Cryptojacking
    color: green
    aliases: [Cryptominer, Cryptomining, Crypto Mining, Cryptojacker]
