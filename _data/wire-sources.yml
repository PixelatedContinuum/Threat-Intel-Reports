# The entire Wire filter, in one reviewable file.
#
# Classification is by source, on measurement (see the spec, section 2). A
# research source publishes threat research by definition, so its source IS the
# filter and it passes through untouched. A news source takes the keyword rule
# below, which is approximate in both directions and is applied only where that
# is tolerable.
#
# An unknown source takes `default`, which is `news` and must never be
# `exclude`: a new feed appearing in OpenCTI has to show up filtered rather than
# vanish silently. check-wire.js warns by name so it gets classified deliberately.
sources:
  AlienVault: research
  Palo Alto Networks: research
  Cisco Talos: research
  Crowdstrike: research
  Elastic: research
  Microsoft: research
  BitDefender: research
  # Both of these ingested nothing until 2026-08-25: feeds.trendmicro.com had a
  # broken TLS cert, and the cloud.google.com RSS path served the blog's HTML
  # shell rather than a feed. Fixed by repointing to FeedBurner and to the
  # cloudblog.withgoogle.com origin respectively.
  Trend Micro: research
  # The Google Threat Intelligence / Mandiant ingester files under the bare
  # identity "Google", which is the string OpenCTI hands the exporter. Research
  # rather than news on purpose: the keyword filter would drop titles like
  # "Updated Cyber Threat Actor Naming System", which match none of the keep
  # terms below, and Mandiant writes a lot of them.
  Google: research
  # Trend Micro's vulnerability-research arm. This is the ZDI *blog* feed, which
  # publishes articles with https links. Their published-advisories feed is
  # deliberately NOT ingested: its item links are http, which the exporter drops
  # and check-wire.js then fails as a missing url, and it batches up to 49
  # advisories on a patch day, which would bury a day's actual headlines.
  Zero Day Initiative: research
  BleepingComputer: news
  SecurityWeek: news
  Recorded Future: news
  Krebs on Security: news
  # Publishes "Maltrail IOC for 2026-08-12" style dumps, one a day. IOC lists,
  # not articles, so there is nothing for a reader to click through to.
  Krawczyk Industries Limited: exclude
  # Our own reports. Already published on this site.
  The Hunters Ledger: exclude

default: news

# A term ending in "*" is a prefix match. Every other term is word-bounded,
# which is what stops "rat" firing on "corporate" and "bot" on "robot". A
# boundary is only asserted on a side that ends in a word character, so
# "raises $" still reaches "Raises $7.5 Million".
keep:
  - ransomware
  - malware
  - backdoor
  - botnet
  - bot
  - rootkit
  - stealer
  - infostealer
  - trojan
  - spyware
  - worm
  - loader
  - dropper
  - rat
  - rats
  - c2
  - command-and-control
  - phish*
  - smishing
  - vishing
  - exploit*
  - zero-day
  - zero day
  - 0-day
  - cve-*
  - vulnerab*
  - rce
  - privilege escalation
  - sql injection
  - xss
  - deserializ*
  - breach*
  - leak*
  - hack*
  - compromis*
  - intrusion
  - attack*
  - threat actor
  - apt
  - nation-state
  - espionage
  - campaign
  - supply chain
  - credential*
  - password spray*
  - brute force
  - brute-force
  - ddos
  - wiper
  - cryptomin*
  - cryptojack*
  - webshell
  - web shell
  - persistence
  - lateral movement
