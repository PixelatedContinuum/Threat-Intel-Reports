# Topic chips are precomputed by the generator, not counted in Liquid. Measured
# reason: 531 items carry 1,267 distinct labels, which the generic listing-filter
# include would turn into 133 chips and 3.2 million loop iterations per build.
#
# Sources use their own vocabularies, so these fold variants of one concept onto
# a single chip.
topic_aliases:
  vulnerability: vulnerabilities
  vulnerabilities: vulnerabilities
  data breach: data breaches
  data breaches: data breaches
  ai: artificial intelligence
  malware & threats: malware
  cyberattack: cyberattacks
  phishing attack: phishing

# Labels too generic to be a useful control. "security" sits on 28% of items, so
# filtering by it selects nearly the whole page and tells the reader nothing.
topic_stop:
  - security
  - news
  - news briefs
  - featured
  - general
  - technology
  - observation
  - osint
  - perpetual
  - unsupervised
  - manual-collection

drop:
  - "raises $"
  - "secures $"
  - "raised $"
  - series a
  - series b
  - series c
  - funding round
  - acquir*
  - merger
  - webinar
  - virtual event
  - summit
  - conference
  - ciso conversations
  - appoints
  - names new
  - hires
  - joins as
  - earnings
  - ipo
  - tests faster
  - tests new
  - rolls out
  - now available
  - preview build
  - insider build
  - subscription
  # Security-feature launches that name a threat (T-0353, rubric v2 item 9,
  # Joseph 2026-10-22). Measured on 1071 kept news items: drops 2, both feature
  # news ("Signal adds new security feature...", "WhatsApp Unveils New Scam Alert
  # Feature"), no threat story. "to block" was rejected: it drops a malware story.
  # Verb-anchored, not bare "security feature*" (review): Microsoft's CVE class
  # "Security Feature Bypass" must never be dropped.
  - adds new security feature*
  - adds security feature*
  - new scam alert feature*
  - powered scam detection
  - adds scam detection

# Research sources bypass keep and drop, so a vendor's own product, alliance or
# analyst-ranking post reaches the page and earns tags from "AI" or "cloud".
# A research item whose title matches a term here, and carries no keep term,
# gets no rule tags; the item stays (wire_export.rule_tags, T-0353). The keep
# guard means "Elastic Agent flaw exploited" keeps its tags. News items are
# drop's job. Measured on the 2026-10-19 90-day pool: suppresses 14 of 16
# product posts, 1 of 7 mixed pitches and 0 of 375 content items among the 398
# tagged research items (tasks/runs/T-0353/ in the workflows repo).
tag_suppress:
  - new in falcon
  - falcon cloud security
  - falcon data security
  - falcon guardian
  - falcon aidr
  - crowdstrike extends
  - crowdstrike accelerates
  - crowdstrike announces
  - crowdstrike delivers
  - crowdstrike and nvidia
  - secure ai alliance
  - named strongest
  - named a leader
  - frost radar
  - magic quadrant
  - forrester wave
  - agentic soc
  - elastic agent
  - new with google cloud
  - ai-native security platform

# Rule-derived tags (T-0105). Matched against the headline only, with the same
# term syntax as keep and drop (word-bounded, "*" for a prefix). A matching tag
# goes in front of the feed's own labels, and the page draws the first two, so
# the order here is the display priority: specific tags first, the broad
# "vulnerabilities" and "malware" last. Tag names reuse the existing chip names
# where there is one, so rule tags and upstream labels count together.
# Precision was sampled before shipping; see Docs/hunters-ledger-wire-feed-2026-10-02.md
# in the workflows repo. Re-measured 2026-10-19 after the T-0339 additions on a
# fresh 60-pair sample: 54/60 strict (below the 57/60 bar; both wrong pairs from
# terms older than T-0339), 58/60 lenient; tasks/runs/T-0339/results.md there.
# T-0349 (2026-10-19) narrowed breach*, leaked, exploitation, ios, copilot,
# agentic, prc, sentence and charged to phrases; result and re-measurement in
# tasks/runs/T-0349/results.md there. T-0353 (2026-10-22) restored bare copilot,
# added breach record nouns and the tag_suppress list above; tasks/runs/T-0353/.
# Then narrowed ransom* and north korea* to Joseph's 2026-10-22 rubric decisions
# (tasks/runs/T-0353/RUBRIC.md v2 there).
tag_rules:
  zero-day:
    - zero-day*
    - zero day*
    - 0-day*
  exploited:
    - exploited
    - exploiting
    - in the wild
    # Not bare "exploitation" (T-0349): it fired on "post-exploitation",
    # "exploitation techniques" and "exploitation is imminent".
    - exploitation of
    - active exploitation
    - mass exploitation
    - exploitation campaign*
    - zero-day exploitation
    - 0-day exploitation
  ransomware:
    # Not bare "ransom*" (T-0353, rubric v2 item 4, Joseph 2026-10-22): a ransom
    # or extortion demand with no encryption or gang named is not ransomware.
    - ransomware*
    - ransom cartel
    - lockbit
    - akira
    - qilin
    - clop
