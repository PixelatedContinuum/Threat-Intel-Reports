# Topic chips are precomputed by the generator, not counted in Liquid. Measured
# reason: 531 items carry 1,267 distinct labels, which the generic listing-filter
# include would turn into 133 chips and 3.2 million loop iterations per build.
#
# Sources use their own vocabularies, so these fold variants of one concept onto
# a single chip.
topic_aliases:
  vulnerability: vulnerabilities
  vulnerabilities: vulnerabilities
  data breach: data breaches
  data breaches: data breaches
  ai: artificial intelligence
  malware & threats: malware
  cyberattack: cyberattacks
  phishing attack: phishing

# Labels too generic to be a useful control. "security" sits on 28% of items, so
# filtering by it selects nearly the whole page and tells the reader nothing.
topic_stop:
  - security
  - news
  - news briefs
  - featured
  - general
  - technology
  - observation
  - osint
  - perpetual
  - unsupervised
  - manual-collection

drop:
  - "raises $"
  - "secures $"
  - "raised $"
  - series a
  - series b
  - series c
  - funding round
  - acquir*
  - merger
  - webinar
  - virtual event
  - summit
  - conference
  - ciso conversations
  - appoints
  - names new
  - hires
  - joins as
  - earnings
  - ipo
  - tests faster
  - tests new
  - rolls out
  - now available
  - preview build
  - insider build
  - subscription

# Rule-derived tags (T-0105). Matched against the headline only, with the same
# term syntax as keep and drop (word-bounded, "*" for a prefix). A matching tag
# goes in front of the feed's own labels, and the page draws the first two, so
# the order here is the display priority: specific tags first, the broad
# "vulnerabilities" and "malware" last. Tag names reuse the existing chip names
# where there is one, so rule tags and upstream labels count together.
# Precision was sampled before shipping; see Docs/hunters-ledger-wire-feed-2026-10-02.md
# in the workflows repo.
tag_rules:
  zero-day:
