# T-0608 probe: which variable stopped Chrome opening its debugging port on the runner. Branch t0608-probe only; never on main.
name: t0608 chrome probe
on:
  push:
    branches: [t0608-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bin: [/usr/bin/chromium, /usr/bin/google-chrome]
        wait: ["30000", "90000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Launch three times and time each
        working-directory: tools/report-tooling
        run: |
          echo "bin=${{ matrix.bin }} wait=${{ matrix.wait }}"
          ls -l "${{ matrix.bin }}" || true
          "${{ matrix.bin }}" --version || true
          for i in 1 2 3; do
            s=$(date +%s%N)
            HL_CHROME="${{ matrix.bin }}" HL_CDP_LAUNCH_WAIT_MS="${{ matrix.wait }}" node -e "
              const CDP=require('./lib/cdp');
              (async()=>{try{const p=await CDP.open('about:blank',{width:1280,height:900});console.log('OPENED');await p.close();}catch(e){console.log('FAILED: '+e.message);process.exitCode=1}})()" || echo "rc=$?"
            e=$(date +%s%N); echo "try $i: $(( (e-s)/1000000 )) ms"
          done
